<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Six AI roles, one draft PR</title>
<style>
  /* House look. Copy this block as is; see AGENTS.md. */
  :root{--bg:#141414;--fg:#e6e6e6;--dim:#9a9a9a;--font:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
  svg{display:block;width:100%;height:auto}
  svg text{font-family:var(--font);fill:var(--fg)}
  .dim{fill:var(--dim)}
  .ln{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke-width:1.5}
  .draw{stroke-dasharray:1;stroke-dashoffset:1}
  .fade{opacity:0}
  .go .draw{animation:draw .7s ease-out forwards;animation-delay:var(--d,0s)}
  .go .fade{animation:fade .5s ease-out forwards;animation-delay:var(--d,0s)}
  .final .draw{stroke-dashoffset:0}
  .final .fade{opacity:1}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
</style>
<script>
  // ?final shows the end state (for PNG and PDF); otherwise the drawing plays once.
  addEventListener('DOMContentLoaded',()=>document.body.classList.add(new URLSearchParams(location.search).has('final')?'final':'go'));
</script>
</head><body>

="1" x="90" y="805" width="270" height="80" rx="10" style="--d:4.80s"/><text x="225" y="853" font-size="28" text-anchor="middle" class="fade" style="--d:5.10s">scope</text><rect class="ln draw" pathLength="1" x="405" y="805" width="270" height="80" rx="10" style="--d:4.88s"/><text x="540" y="853" font-size="28" text-anchor="middle" class="fade" style="--d:5.18s">type safety</text><rect class="ln draw" pathLength="1" x="720" y="805" width="270" height="80" rx="10" style="--d:4.96s"/><text x="855" y="853" font-size="28" text-anchor="middle" class="fade" style="--d:5.26s">regression</text><text x="540" y="912" font-size="20" text-anchor="middle" class="dim fade" style="--d:5.40s">three independent reviewers, same verified change</text><rect class="ln draw" pathLength="1" x="90" y="935" width="900" height="72" rx="10" style="--d:5.60s"/><text x="540" y="980" font-size="26" text-anchor="middle" class="fade" style="--d:6.00s">signed commit → CI on that exact commit</text><path class="ln draw" pathLength="1" d="M400 1007 V1047 M388 1031 L400 1047 L412 1031" style="--d:6.20s"/><rect class="ln draw" pathLength="1" x="220" y="1047" width="360" height="80" rx="10" style="--d:6.40s;stroke-width:5"/><text x="400" y="1097" font-size="30" text-anchor="middle" font-weight="700" class="fade" style="--d:6.80s">draft PR</text><path class="ln draw thin" pathLength="1" d="M580 1087 H680" style="--d:6.60s"/><rect class="ln draw thin" pathLength="1" x="680" y="1047" width="310" height="80" rx="10" style="--d:6.70s"/><text x="835" y="1085" font-size="26" text-anchor="middle" class="fade" style="--d:7.00s">PR writer</text><text x="835" y="1114" font-size="20" text-anchor="middle" class="dim fade" style="--d:7.00s">read-only</text><text x="90" y="1185" font-size="28" text-anchor="start" class="fade" style="--d:7.40s">Then I approve the exact title, body and commit.</text><path class="ln thin" d="M90 1230 H990"/><text x="90" y="1280" font-size="24" text-anchor="start" class="dim">Viral Shastri · darkov19.github.io</text></svg>
</body></html>
